name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 18.x
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Build application
      run: npm run build
    - name: Start application
      run: |
        npm start -- --host 0.0.0.0 --port 4200 --poll 2000 > app.log 2>&1 &
        sleep 5
        if ! pgrep -f "ng serve" > /dev/null; then
          echo "❌ Failed to start application"
          cat app.log
          exit 1
        fi
        echo "✅ Application process started"    
    - name: Wait for application
      run: |
        echo "⏳ Waiting for http://localhost:4200..."
        npx -y wait-on http://127.0.0.1:4200 --timeout 180000
        echo "✅ Application is ready"
    - name: Verify application is running
      run: |
        curl -f http://127.0.0.1:4200 || (echo "App not responding" && cat app.log && exit 1)
    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test      
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: app-log
        path: app.log
        retention-days: 7